name: recode
description: Application de reprogrammation sensorielle silencieuse par PNL et hypnose visuelle
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.9

  # Local Database
  sqflite: ^2.3.0
  path: ^1.8.3

  # Encryption
  encrypt: ^5.0.3

  # Animations
  flutter_animate: ^4.3.0

  # Haptic Feedback
  vibration: ^1.8.4

  # Charts
  fl_chart: ^0.65.0

  # Icons
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/animations/
